<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060606;
    --panel: rgba(255,255,255,0.025);
    --glass: rgba(255,255,255,0.035);
    --glass-hover: rgba(255,255,255,0.055);
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --text: #ececec;
    --text-dim: #9a9a9a;
    --accent-glow: rgba(255,255,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    letter-spacing: 0.01em;
  }

  /* Sidebar */
  .sidebar {
    width: 68px;
    height: 100%;
    border-right: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .sidebar-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
  }

  .sidebar-group.top { margin-bottom: auto; }
  .sidebar-group.bottom { margin-top: auto; }

  .s-item {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-dim);
    transition: all 0.2s ease;
    position: relative;
  }

  .s-item:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }

  .s-item.active {
    color: var(--text);
  }

  .s-item.active::before {
    content: '';
    position: absolute;
    left: -14px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 20px;
    background: #fff;
    border-radius: 0 3px 3px 0;
    opacity: 0.8;
  }

  /* Main */
  .main {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Background effects */
  .bg-fx {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .beam {
    position: absolute;
    bottom: 52%;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 70vh;
    background: conic-gradient(from 180deg at 50% 100%, transparent 0deg, rgba(255,255,255,0.06) 30deg, rgba(255,255,255,0.10) 60deg, rgba(255,255,255,0.06) 90deg, transparent 120deg);
    filter: blur(60px);
    opacity: 0.7;
    animation: beamPulse 6s ease-in-out infinite;
  }

  @keyframes beamPulse {
    0%, 100% { opacity: 0.5; transform: translateX(-50%) scaleY(1); }
    50% { opacity: 0.8; transform: translateX(-50%) scaleY(1.05); }
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    filter: blur(20px);
  }

  .orb-1 { width: 400px; height: 400px; top: 10%; left: 50%; transform: translateX(-50%); opacity: 0.4; }
  .orb-2 { width: 600px; height: 600px; bottom: -10%; right: -10%; opacity: 0.15; background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%); }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Atmospheric vignette: bright gray center fading to black edges */
  .atmosphere {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(
      ellipse 130% 155% at 50% 40%,
      rgba(205, 205, 215, 0.40) 0%,
      rgba(195, 195, 205, 0.34) 5%,
      rgba(185, 185, 195, 0.28) 10%,
      rgba(175, 175, 185, 0.22) 15%,
      rgba(160, 160, 170, 0.16) 21%,
      rgba(145, 145, 155, 0.12) 27%,
      rgba(130, 130, 140, 0.09) 34%,
      rgba(110, 110, 120, 0.06) 42%,
      rgba(90, 90, 100, 0.04) 51%,
      rgba(70, 70, 80, 0.03) 60%,
      rgba(50, 50, 58, 0.02) 70%,
      rgba(35, 35, 40, 0.015) 80%,
      rgba(25, 25, 30, 0.01) 88%,
      #060606 100%
    );
  }

  /* Content */
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 780px;
    padding: 0 24px;
    gap: 28px;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.2;
  }

  /* Glass Input */
  .glass-input-wrap {
    width: 100%;
    margin-top: 8px;
  }

  .glass-input {
    width: 100%;
    background: var(--glass);
    backdrop-filter: blur(32px) saturate(150%);
    -webkit-backdrop-filter: blur(32px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 18px 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .glass-input::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 22px;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.6;
  }

  .glass-input:hover, .glass-input:focus-within {
    background: var(--glass-hover);
    border-color: var(--border-hover);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .glass-input textarea {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.5;
    resize: none;
    width: 100%;
    min-height: 52px;
    max-height: 200px;
  }

  .glass-input textarea::placeholder {
    color: var(--text-dim);
    opacity: 0.8;
  }

  .input-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s ease;
    padding: 0;
  }

  .icon-btn:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }

  .icon-btn.send {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  .icon-btn.send:hover {
    background: rgba(255,255,255,0.18);
  }

  /* Action chips */
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 12px;
  }

  .chip {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 9px 16px;
    font-size: 0.82rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.25s ease;
    user-select: none;
  }

  .chip:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.12);
    color: var(--text);
    transform: translateY(-1px);
  }

  .chip svg {
    width: 16px;
    height: 16px;
    opacity: 0.7;
    flex-shrink: 0;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .content { padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    .actions { gap: 8px; }
    .chip { padding: 8px 12px; font-size: 0.78rem; }
  }

  @media (max-width: 480px) {
    .actions {
      flex-wrap: nowrap;
      overflow-x: auto;
      justify-content: flex-start;
      width: 100%;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .actions::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; }
    .glass-input { padding: 14px 16px 10px; }
  }

  /* Subtle noise overlay */
  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 200px 200px;
  }
</style>
</head>
<body>

<div class="noise"></div>

<aside class="sidebar">
  <div class="sidebar-group top">
    <div class="s-item active">
      <!-- logo icon -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div class="s-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
    <div class="s-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    </div>
    <div class="s-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div class="s-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
    </div>
    <div class="s-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
    </div>
    <div class="s-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    </div>
  </div>
  <div class="sidebar-group bottom">
    <div class="s-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>
</aside>

<main class="main">
  <div class="bg-fx" id="bgFx">
    <div class="beam"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="atmosphere"></div>

  <div class="content">
    <h1>How can i help you today?</h1>

    <div class="glass-input-wrap">
      <div class="glass-input">
        <textarea placeholder="What do you want to know ?" rows="1" id="mainInput"></textarea>
        <div class="input-footer">
          <button class="btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            Auto
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="btn-group">
            <button class="icon-btn" title="刷新">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
            <button class="icon-btn" title="表情">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            </button>
            <button class="icon-btn" title="语音">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button class="icon-btn send" title="发送">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="8.5" r="1.5"/><path d="M9 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><path d="M9 12l2 2 4-4"/></svg>
        Generate ideas
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/><path d="M12 12a8 8 0 0 0 8-8"/><path d="M12 12a8 8 0 0 1 8 8"/><path d="M12 12a8 8 0 0 0-8 8"/><path d="M12 12a8 8 0 0 1-8-8"/></svg>
        Motion concept
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
        Market analysis
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Ask AI anything
      </div>
    </div>
  </div>
</main>

<script>
  // Generate subtle background particles
  const bgFx = document.getElementById('bgFx');
  const particleCount = 40;
  for (let i = 0; i < particleCount; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const size = Math.random() * 2 + 1;
    const duration = Math.random() * 20 + 10;
    const delay = Math.random() * 10;
    p.style.left = x + '%';
    p.style.top = y + '%';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.opacity = Math.random() * 0.4 + 0.1;
    p.style.animation = `float ${duration}s ease-in-out ${delay}s infinite`;
    bgFx.appendChild(p);
  }

  // Add float animation dynamically
  const style = document.createElement('style');
  style.textContent = `
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(${Math.random()*20-10}px, ${Math.random()*20-10}px); }
      66% { transform: translate(${Math.random()*20-10}px, ${Math.random()*20-10}px); }
    }
  `;
  document.head.appendChild(style);

  // Textarea auto-resize
  const textarea = document.getElementById('mainInput');
  textarea.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
  });
</script>

</body>
</html>
