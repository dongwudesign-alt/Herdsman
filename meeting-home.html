<style>
/* Right - Start Recording */
.mt-start-rec {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.mt-start-rec::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(
      circle at center,
      rgba(255,255,255,0.18) 0%,
      rgba(255,255,255,0.12) 15%,
      rgba(255,255,255,0.07) 30%,
      rgba(255,255,255,0.04) 50%,
      rgba(255,255,255,0.02) 70%,
      transparent 90%
    );
    pointer-events: none;
    z-index: 0;
    transition: all 0.4s ease;
}

.mt-start-rec:hover::before {
    width: 850px;
    height: 850px;
    background: radial-gradient(
      circle at center,
      rgba(255,255,255,0.28) 0%,
      rgba(255,255,255,0.18) 15%,
      rgba(255,255,255,0.10) 30%,
      rgba(255,255,255,0.06) 50%,
      rgba(255,255,255,0.03) 70%,
      transparent 90%
    );
}

.mt-start-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    position: relative;
    z-index: 1;
}

.mt-record-btn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.15),
      0 8px 32px rgba(0,0,0,0.4),
      inset 0 1px 1px rgba(255,255,255,0.1);
}

.mt-record-btn::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.18);
    animation: recordPulse 2.5s ease-out infinite;
}

.mt-record-btn::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    animation: recordPulse 2.5s ease-out infinite 0.8s;
}

.mt-record-btn:hover {
    background: rgba(255,255,255,0.12);
    transform: scale(1.05);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.25),
      0 12px 48px rgba(0,0,0,0.5),
      0 0 40px rgba(255,255,255,0.08),
      inset 0 1px 1px rgba(255,255,255,0.15);
}

.mt-record-btn:active {
    transform: scale(0.96);
}

.mt-record-btn svg {
    position: relative;
    z-index: 1;
}

.mt-start-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.mt-start-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.02em;
}

.mt-start-desc {
    font-size: 0.8rem;
    color: var(--text-dim);
    line-height: 1.6;
    text-align: center;
    max-width: 280px;
}

.mt-start-stats {
    display: flex;
    gap: 24px;
    padding-top: 8px;
}

.mt-start-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

.mt-start-stat-value {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
}

.mt-start-stat-label {
    font-size: 0.72rem;
    color: var(--text-dim);
}

.mt-start-divider {
    width: 1px;
    background: rgba(255,255,255,0.08);
    align-self: stretch;
}
</style>
